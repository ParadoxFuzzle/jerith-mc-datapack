  - $delay$/execute as @s[tag=RulesAccepted] at @s run function jerith:casteffect/1 #cut some fat.

  delaytimer: 1
  delaytimer_format: TICKS
  cooldown: 10
  error-message: "&f[&4&lJerith&f]: &cInvalid world, can only be used in Survival and End world."
